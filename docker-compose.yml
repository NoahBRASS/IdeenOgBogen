services:
  mysql:
    image: mysql:8.4
    container_name: ideenogbogen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: IdeenOgBogen
    ports:
      - "3306:3306"
    volumes:
      - ideenogbogen_mysql_data:/var/lib/mysql

volumes:
  ideenogbogen_mysql_data: